services:
  bot:
    env_file:
      - .env
    environment:
      SESSION_ENCRYPTION_KEY_FILE: "${SESSION_ENCRYPTION_KEY_FILE:-/run/local-secrets/session_encryption.key}"
    volumes:
      - type: bind
        source: ./secrets
        target: /run/local-secrets
        read_only: true

  portal-worker:
    profiles: ["portal"]
    env_file:
      - .env
    environment:
      SESSION_ENCRYPTION_KEY_FILE: "${SESSION_ENCRYPTION_KEY_FILE:-/run/local-secrets/session_encryption.key}"
    volumes:
      - type: bind
        source: ./secrets
        target: /run/local-secrets
        read_only: true
